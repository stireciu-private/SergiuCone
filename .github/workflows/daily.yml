name: Revista presei

on:
  schedule:
    # GitHub lucrează în UTC. 05:00 UTC = 08:00 vara, 06:00 UTC = 08:00 iarna;
    # scriptul (--scheduled) trimite o singură dată pe zi, la prima rulare de după 08:00.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch: # buton „Run workflow” pentru o rulare manuală

permissions:
  contents: read # workflow-ul nu mai scrie nimic în repository

concurrency:
  group: revista-presei

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Memoria articolelor deja trimise (data/seen.json) se păstrează între rulări în cache-ul
      # GitHub Actions, nu în repository. Fiecare rulare salvează o versiune nouă, iar următoarea
      # o preia pe cea mai recentă. Dacă cache-ul lipsește, scriptul pornește fără memorie și
      # poate retrimite o dată articolele din ultimele zile.
      - name: Preia memoria articolelor trimise
        uses: actions/cache/restore@v5
        with:
          path: data/seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Colectează articolele și trimite e-mailul
        run: python -m stiri ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Salvează memoria articolelor trimise
        if: always() && hashFiles('data/seen.json') != ''
        uses: actions/cache/save@v5
        with:
          path: data/seen.json
          key: seen-${{ github.run_id }}-${{ github.run_attempt }}
